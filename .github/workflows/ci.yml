name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
    stylelint:
        name: Stylelint
        runs-on: ubuntu-latest

        defaults:
            run:
                working-directory: client_site

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: 'npm'
                  cache-dependency-path: client_site/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Run Stylelint
              run: npx stylelint **/*.css

    prettier:
        name: Prettier
        runs-on: ubuntu-latest

        defaults:
            run:
                working-directory: client_site

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: 'npm'
                  cache-dependency-path: client_site/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Run Prettier
              run: npx prettier --check .

    eslint:
        name: ESLint
        runs-on: ubuntu-latest

        defaults:
            run:
                working-directory: client_site

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: 'npm'
                  cache-dependency-path: client_site/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Run ESLint
              run: npx eslint .

    clang-format:
        name: Clang Format
        runs-on: ubuntu-latest

        defaults:
            run:
                working-directory: server

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install clang-format
              run: |
                  sudo apt-get update
                  sudo apt-get install -y clang-format

            - name: Check formatting
              run: |
                  find . \
                    \( -name "*.cpp" -o -name "*.hpp" -o -name "*.h" \) \
                    -print0 \
                    | xargs -0 clang-format --dry-run --Werror

    clang-tidy:
        name: Clang Tidy
        runs-on: ubuntu-latest

        defaults:
            run:
                working-directory: .

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                      clang \
                      clang-tidy \
                      cmake \
                      qt6-base-dev

            - name: Configure
              run: cmake -B build -S . -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

            - name: Run clang-tidy
              run: |
                  find client_gui server shared \
                    \( -name "*.cpp" -o -name "*.hpp" -o -name "*.h" \) \
                    -print0 \
                    | xargs -0 clang-tidy -p build