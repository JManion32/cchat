server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name cchat.fun www.cchat.fun;

    root __HOME__/client_site;
    index index.html;

    # The site uses BrowserRouter, so paths like /chat exist only in the
    # client. Without this fallback a refresh or a shared deep link 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The gateway has to be reached through nginx rather than direct on its own
    # port: an https:// page may not open a ws:// socket, so the WebSocket needs
    # to share this server's TLS. Matches before location / because it is the
    # more specific prefix.
    location /ws {
        proxy_pass http://127.0.0.1:__WS_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Chat connections idle between messages. The default 60s read timeout
        # would drop them mid-session.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Vite fingerprints these filenames, so a stale copy is impossible.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html itself must never be cached, or browsers keep loading the
    # old bundle after a deploy and request asset hashes that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
